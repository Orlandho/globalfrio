# MySQL real: Docker Compose prepara el esquema y los datos una sola vez.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/globalfrio_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USUARIO:globalfrio_backend}
spring.datasource.password=${DB_CLAVE}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
